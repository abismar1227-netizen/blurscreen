[package]
name = "blurscreen"
version = "0.1.0"
edition = "2021"
description = "Privacy blur window for screen sharing (Discord etc.)"

[dependencies]
scap = "0.0.8"
softbuffer = "0.4"
winit = "0.30"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.2", features = ["NSProcessInfo", "NSString"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
